{% extends 'base.html' %}

{% block titulo %}
Importar PDF de mantenimientos
{% endblock %}

{% block content %}

<div class="card shadow-sm border-0">
    <div class="card-header bg-primary text-white">
        <strong>Importar mantenimientos desde PDF</strong>
    </div>

    <div class="card-body">
        <form method="POST" enctype="multipart/form-data">
            {% csrf_token %}

            <div class="mb-3">
                <label class="form-label fw-semibold">Archivo PDF</label>
                <input type="file" name="archivo_pdf" accept=".pdf" class="form-control" required>
            </div>

            <div class="form-check mb-3">
                <input class="form-check-input" type="checkbox"
                       name="actualizar_existentes" value="1"
                       id="actualizar-existentes" checked>
                <label class="form-check-label" for="actualizar-existentes">
                    Actualizar tickets que ya existen con la información corregida del PDF
                </label>
                <div class="form-text">
                    No elimina registros ni reemplaza archivos adjuntos u órdenes agregadas manualmente.
                </div>
            </div>

            <button type="submit" class="btn btn-success">
                Analizar PDF
            </button>

            <a href="{% url 'listar_mantenimientos' %}" class="btn btn-secondary">
                Cancelar
            </a>
        </form>
    </div>
</div>

{% endblock %}
